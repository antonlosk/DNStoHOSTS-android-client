name: Build Android APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Install dependencies
        run: |
          go mod tidy
          go get .

      - name: Install Fyne dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc golang-go libgl1-mesa-dev xorg-dev

      - name: Install fyne-cross
        run: go install github.com/fyne-io/fyne-cross@latest

      - name: Build APK using fyne-cross
        # Попытка собрать с иконкой
        run: |
          ~/go/bin/fyne-cross android -app-id com.dnstohosts.app -name DNStoHOSTS -icon icon.png .
        continue-on-error: true
      
      - name: Build APK using fyne-cross (Fallback without icon)
        if: failure()
        # Если иконки нет, собираем без нее
        run: |
          ~/go/bin/fyne-cross android -app-id com.dnstohosts.app -name DNStoHOSTS .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DNStoHOSTS.apk
          # ИСПРАВЛЕНО: путь ведет к dist/android, а не bin/android
          path: fyne-cross/dist/android/DNStoHOSTS.apk
