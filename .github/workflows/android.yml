name: Build and Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '9.1.0' # Обновлено до 9.1.0

    - name: Calculate Next Version
      id: version_calc
      run: |
        LAST_TAG=$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || echo "v0.0.0")
        echo "Last tag found: $LAST_TAG"

        VERSION=${LAST_TAG#v}
        IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

        PATCH=$((PATCH + 1))

        if [ "$PATCH" -gt 10 ]; then
          PATCH=0
          MINOR=$((MINOR + 1))
        fi

        if [ "$MINOR" -gt 10 ]; then
          MINOR=0
          MAJOR=$((MAJOR + 1))
        fi

        NEW_VERSION="$MAJOR.$MINOR.$PATCH"
        echo "Calculated new version: $NEW_VERSION"

        echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
        echo "NEW_TAG=v$NEW_VERSION" >> $GITHUB_ENV

    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ ! -z "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
        else
          echo "No keystore secret. Using auto-debug signing."
        fi

    - name: Build Release APK
      run: gradle assembleRelease -PversionName=${{ env.NEW_VERSION }} -PversionCode=${{ github.run_number }} --stacktrace
      env:
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        ALIAS_PASSWORD: ${{ secrets.ALIAS_PASSWORD }}

    - name: Rename APK
      run: |
        mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/DNStoHOSTS-${{ env.NEW_VERSION }}.apk

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ env.NEW_TAG }}
        name: Release ${{ env.NEW_VERSION }}
        body: "Автоматический релиз версии ${{ env.NEW_VERSION }}"
        draft: false
        prerelease: false
        files: app/build/outputs/apk/release/DNStoHOSTS-${{ env.NEW_VERSION }}.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
