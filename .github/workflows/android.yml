name: Build and Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Разрешение на загрузку релизов

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'
        cache-disabled: true

    # Исправленный шаг: проверка наличия ключа через Bash
    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ ! -z "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          echo "Keystore successfully decoded."
        else
          echo "No keystore secret found. Using debug keystore automatically."
        fi

    # Сборка
    - name: Build Release APK
      run: gradle assembleRelease --stacktrace
      env:
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        ALIAS_PASSWORD: ${{ secrets.ALIAS_PASSWORD }}

    # Переименование для удобства
    - name: Rename APK
      run: |
        mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/DNStoHOSTS.apk

    # Загрузка в релизы
    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: latest
        name: Latest Build
        body: "Автоматическая сборка последней версии. Если вы не настраивали ключи, используется тестовая подпись."
        draft: false
        prerelease: false
        files: app/build/outputs/apk/release/DNStoHOSTS.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
