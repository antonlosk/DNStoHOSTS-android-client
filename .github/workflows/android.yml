name: Build and Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Разрешение на создание релизов

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'
        cache-disabled: true

    # 1. Декодируем Keystore из секретов в файл
    - name: Decode Keystore
      if: ${{ secrets.KEYSTORE_BASE64 != '' }}
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    # 2. Собираем RELEASE (используя секреты для подписи)
    - name: Build Release APK
      run: gradle assembleRelease --stacktrace
      env:
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        ALIAS_PASSWORD: ${{ secrets.ALIAS_PASSWORD }}

    # 3. Переименовываем APK для красоты
    - name: Rename APK
      run: |
        mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/DNStoHOSTS.apk

    # 4. Создаем (или обновляем) релиз "Latest Build" и загружаем файл
    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: latest
        name: Latest Build
        body: "Автоматическая сборка последней версии."
        draft: false
        prerelease: false
        files: app/build/outputs/apk/release/DNStoHOSTS.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
